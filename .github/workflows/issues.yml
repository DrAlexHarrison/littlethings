name: Issues
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.issue.body || '').trim();
            const words = body.split(/\s+/).filter(Boolean).length;
            const tldr = /^[\s#*_>]*TL;?DR/i.test(body.split('\n')[0] || '');
            if (words > 0 && words <= 100 && tldr) return;
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number };
            await github.rest.issues.createComment({ ...issue, body: 'Closed unread: issues here are 100 words at most and start with a one-line TL;DR. See AGENTS.md.' });
            await github.rest.issues.update({ ...issue, state: 'closed', state_reason: 'not_planned' });
