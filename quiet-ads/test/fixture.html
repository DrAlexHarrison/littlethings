<body>
<div id="movie_player" class="html5-video-player"><video id="v1" loop></video></div>
<div id="ui"></div>
<script>
  // 2 s of silence, 8 kHz mono 8-bit WAV, built in the page. Nothing audible.
  function silentWav() {
    const n = 16000, b = new Uint8Array(44 + n), dv = new DataView(b.buffer);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };
    w(0, 'RIFF'); dv.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, 8000, true); dv.setUint32(28, 8000, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true); w(36, 'data'); dv.setUint32(40, n, true);
    b.fill(128, 44); return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
  }
  window.SRC = silentWav();
  window.__nativeVol = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'volume').get;
  window.pageEvents = [];   // what the SITE's own code would hear
  const v1 = document.getElementById('v1');
  v1.addEventListener('volumechange', () => window.pageEvents.push(v1.volume));
  v1.src = window.SRC;
</script>
